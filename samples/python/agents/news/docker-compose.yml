services:

  llm_ollama-1:
    image: ollama/ollama:0.4.0
    ports:
      - 11435:11434
    volumes:
      - .:/code
      - ./ollama/ollama:/root/.ollama
    container_name: llm_ollama-1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: "all"
              capabilities: [gpu]
    pull_policy: always
    tty: true
    restart: always
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
  llm_ollama-2:
    image: ollama/ollama:0.4.0
    ports:
      - 11436:11434
    volumes:
      - .:/code
      - ./ollama/ollama:/root/.ollama
    container_name: llm_ollama-2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: "all"
              capabilities: [gpu]
    pull_policy: always
    tty: true
    restart: always
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0    
